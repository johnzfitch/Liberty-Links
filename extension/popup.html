<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liberty Links</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      width: 320px;
      background: #1a1a2e;
      color: #eee;
    }

    .header {
      background: linear-gradient(135deg, #16213e 0%, #1a1a2e 100%);
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #2a2a4e;
    }

    .header img {
      width: 32px;
      height: 32px;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
      color: #fff;
    }

    .toggle-section {
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #2a2a4e;
    }

    .toggle-label {
      font-size: 14px;
      color: #ccc;
    }

    .toggle {
      position: relative;
      width: 48px;
      height: 26px;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #3a3a5e;
      transition: 0.3s;
      border-radius: 26px;
    }

    .toggle-slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background-color: #fff;
      transition: 0.3s;
      border-radius: 50%;
    }

    .toggle input:checked + .toggle-slider {
      background-color: #4ade80;
    }

    .toggle input:checked + .toggle-slider:before {
      transform: translateX(22px);
    }

    .stats-section {
      padding: 16px;
    }

    .stats-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      margin-bottom: 12px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .stat-card {
      background: #2a2a4e;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 700;
      color: #4ade80;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .actions-section {
      padding: 16px;
      border-top: 1px solid #2a2a4e;
    }

    .action-btn {
      width: 100%;
      padding: 10px 16px;
      background: #2a2a4e;
      border: none;
      border-radius: 6px;
      color: #ccc;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      margin-bottom: 8px;
    }

    .action-btn:hover {
      background: #3a3a6e;
      color: #fff;
    }

    .action-btn:last-child {
      margin-bottom: 0;
    }

    .action-btn.danger {
      color: #f87171;
    }

    .action-btn.danger:hover {
      background: #7f1d1d;
      color: #fff;
    }

    .footer {
      padding: 12px 16px;
      text-align: center;
      border-top: 1px solid #2a2a4e;
      font-size: 11px;
      color: #666;
    }

    .footer a {
      color: #4ade80;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .status-indicator {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 8px;
    }

    .status-indicator.active {
      background: #4ade80;
      box-shadow: 0 0 8px #4ade80;
    }

    .status-indicator.inactive {
      background: #f87171;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="Liberty Links">
    <h1>Liberty Links</h1>
  </div>

  <div class="toggle-section">
    <span class="toggle-label">
      <span class="status-indicator active" id="status-indicator"></span>
      Protection enabled
    </span>
    <label class="toggle">
      <input type="checkbox" id="enabled-toggle" checked>
      <span class="toggle-slider"></span>
    </label>
  </div>

  <div class="stats-section">
    <div class="stats-title">Statistics</div>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="urls-cleaned">0</div>
        <div class="stat-label">URLs Cleaned</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="params-removed">0</div>
        <div class="stat-label">Params Removed</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="redirects-handled">0</div>
        <div class="stat-label">Redirects Bypassed</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="blocked-requests">0</div>
        <div class="stat-label">Trackers Blocked</div>
      </div>
    </div>
  </div>

  <div class="actions-section">
    <button class="action-btn" id="clean-current">Clean Current Page URL</button>
    <button class="action-btn" id="reprocess-page">Reprocess All Links</button>
    <button class="action-btn danger" id="reset-stats">Reset Statistics</button>
  </div>

  <div class="footer">
    <a href="https://github.com/johnzfitch/Liberty-Links" target="_blank">GitHub</a>
    &middot; v1.0.0
  </div>

  <script src="popup.js"></script>
</body>
</html>
